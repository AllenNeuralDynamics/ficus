[project]
name = "calibration-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "mypy>=1.15.0",
    "psycopg2>=2.9.10",
    "pydantic>=2.11.3",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
    "sqlalchemy>=2.0.40",
    "tox>=4.25.0",
    "tox-uv>=1.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"